<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<style>
  @font-face { font-family: "Anton"; src: url("../docs/assets/fonts/anton-latin.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; src: url("../docs/assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0b0907; color: #f5f1ea; font-family: "Inter", sans-serif; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 45% 70% at 82% 50%, rgba(255, 90, 31, 0.35), rgba(255, 90, 31, 0) 70%); }
  .c { position: absolute; width: 34px; height: 34px; border: 0 solid rgba(245, 241, 234, 0.55); }
  .tl { top: 36px; left: 36px; border-top-width: 3px; border-left-width: 3px; } .tr { top: 36px; right: 36px; border-top-width: 3px; border-right-width: 3px; }
  .bl { bottom: 36px; left: 36px; border-bottom-width: 3px; border-left-width: 3px; } .br { bottom: 36px; right: 36px; border-bottom-width: 3px; border-right-width: 3px; }
  .rec { position: absolute; top: 58px; left: 84px; display: flex; align-items: center; gap: 10px; font: 600 16px Inter; letter-spacing: .2em; }
  .rec i { width: 12px; height: 12px; border-radius: 50%; background: #ff5a1f; }
  h1 { position: absolute; left: 84px; top: 118px; margin: 0; font: 400 118px/0.9 "Anton"; text-transform: uppercase; }
  h1 span { color: #ff5a1f; }
  .mark { position: absolute; left: 86px; bottom: 70px; }
  .mark b { display: block; font: 400 40px/1 "Anton"; letter-spacing: .02em; }
  .mark small { display: block; margin-top: 6px; font: 500 13px Inter; letter-spacing: .5em; color: rgba(245, 241, 234, .65); }
  .tag { position: absolute; right: 84px; bottom: 74px; padding: 12px 18px; border-radius: 12px; background: #ff5a1f; color: #16130f; font: 700 20px Inter; }
</style>
</head>
<body>
  <div class="glow"></div>
  <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
  <p class="rec"><i></i>REC</p>
  <h1>They know<br>the lines.<br><span>Show them you.</span></h1>
  <p class="mark"><b>JUSTIN DAVID</b><small>COACHING</small></p>
  <p class="tag">Self tapes · Coaching · Live on Zoom</p>
</body>
</html>
